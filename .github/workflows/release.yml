name: Windows signed update acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'acceptance needs an existing acceptance-vX.Y.Z-source8 tag; production needs a stable vX.Y.Z tag'
        required: false
        default: acceptance
        type: choice
        options: [acceptance, production, cleanup, replay]
      production_candidate_replay:
        description: 'Replay the real production-signed candidate with CI-only empty production data'
        required: false
        default: false
        type: boolean
      diagnostics_only:
        description: 'Replay only: collect real WebView process flags; never signs or publishes'
        required: false
        default: false
        type: boolean
      replay_run:
        description: 'Diagnostic only: reuse installers from this workflow run; never signs or publishes'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']
  schedule:
    - cron: '17 4 * * 0'
permissions:
  contents: read
  actions: read
concurrency:
  group: mawjivo-release-publication
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.input.outputs.mode }}
      tag: ${{ steps.input.outputs.tag }}
      version: ${{ steps.input.outputs.version }}
      baselineVersion: ${{ steps.input.outputs.baselineVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Resolve strictly gated release mode
        id: input
        env:
          MAWJIVO_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          MAWJIVO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/operator-release.mjs --workflow-inputs
  acceptance:
    needs: resolve
    if: needs.resolve.outputs.mode != 'cleanup'
    env:
      MAWJIVO_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      MAWJIVO_BASELINE_VERSION: ${{ needs.resolve.outputs.baselineVersion }}
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful verification of this commit
        if: inputs.replay_run == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskRuns = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --limit 10 --json conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !($taskRuns | Where-Object { $_.conclusion -eq 'success' })) { throw 'Exact commit verification must pass before signing.' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned tools
        shell: pwsh
        run: |
          $taskPnpm = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm.cmd install --global $taskPnpm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.99.0 --profile minimal
          exit $LASTEXITCODE
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/src-tauri/target
            .tools/tauri-driver
          key: mawjivo-windows-release-1.99-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            mawjivo-windows-release-1.99-
            mawjivo-windows-rust-1.99-
      - name: Prepare verified resources and real notices
        if: inputs.replay_run == ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd media:tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path .tools/tauri-driver/bin/tauri-driver.exe)) {
            cargo install tauri-driver --version 2.1.0 --locked --root .tools/tauri-driver
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build signed clean-install candidate
        if: inputs.replay_run == ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MAWJIVO_TEST_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Acceptance signing secret missing.' }
          node scripts/sync-version.mjs $env:MAWJIVO_BASELINE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Baseline uses the real production namespace on this fresh CI runner,
          # but its updater trusts only the test channel/key. Never distribute it.
          $taskAcceptanceConfig = (Resolve-Path -LiteralPath tools/release-acceptance-tauri.json).Path
          if (Test-Path apps/desktop/src-tauri/target/release/bundle/nsis) {
            Get-ChildItem -LiteralPath apps/desktop/src-tauri/target/release/bundle/nsis -File | Remove-Item
          }
          pnpm.cmd --dir apps/desktop exec tauri build --config $taskAcceptanceConfig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content .tools/acceptance-notes.txt 'اختبار حفظ المساحات والمسودات أثناء التحديث.' -Encoding utf8NoBOM
          node scripts/package-windows-release.mjs apps/desktop/src-tauri/target/release/bundle/nsis .tools/acceptance-base $env:MAWJIVO_BASELINE_VERSION $env:GITHUB_SHA test .tools/acceptance-notes.txt
          exit $LASTEXITCODE
      - name: Build signed next-version candidate and independent verifier
        if: inputs.replay_run == ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MAWJIVO_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          node scripts/sync-version.mjs $env:MAWJIVO_RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath apps/desktop/src-tauri/target/release/bundle/nsis -File | Remove-Item
          # Exact production application config and production signature. The
          # acceptance filename merely avoids reserving an unapproved stable URL.
          pnpm.cmd --dir apps/desktop exec tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --release --features operator-tools --bin verify_update --bin acceptance_data --bin setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-windows-release.mjs apps/desktop/src-tauri/target/release/bundle/nsis .tools/acceptance-next $env:MAWJIVO_RELEASE_VERSION $env:GITHUB_SHA test .tools/acceptance-notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-release.mjs .tools/acceptance-base test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-release.mjs .tools/acceptance-next production
          exit $LASTEXITCODE
      - name: Retain successfully built release inputs before runtime acceptance
        if: inputs.replay_run == '' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/src-tauri/target
            .tools/tauri-driver
          key: mawjivo-windows-release-1.99-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Sign an isolated test copy of the exact production installer bytes
        if: inputs.replay_run == ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MAWJIVO_TEST_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $taskNext = Get-Content -LiteralPath .tools/acceptance-next/package-info.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force .tools/test-signature | Out-Null
          $taskCopy = Join-Path (Resolve-Path .tools/test-signature).Path $taskNext.name
          Copy-Item -LiteralPath ".tools/acceptance-next/$($taskNext.name)" -Destination $taskCopy
          pnpm.cmd --dir apps/desktop exec tauri signer sign --app-version $taskNext.version $taskCopy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $taskCopy -Algorithm SHA256).Hash.ToLowerInvariant() -ne $taskNext.sha256) { throw 'Supplemental signature installer digest changed.' }
          "MAWJIVO_TEST_SIGNATURE=$taskCopy.sig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Stage production bytes and activate only the verified test signature
        if: inputs.replay_run == ''
        shell: pwsh
        env:
          MAWJIVO_RELEASE_ACCOUNT_ID: ${{ vars.MAWJIVO_RELEASE_ACCOUNT_ID }}
          MAWJIVO_RELEASE_ACCESS_KEY_ID: ${{ secrets.MAWJIVO_RELEASE_ACCESS_KEY_ID }}
          MAWJIVO_RELEASE_SECRET_KEY: ${{ secrets.MAWJIVO_RELEASE_SECRET_KEY }}
        run: node scripts/publish-acceptance-candidate.mjs .tools/acceptance-next $env:MAWJIVO_TEST_SIGNATURE
      - name: Prepare diagnostic replay of existing signed installers
        if: inputs.replay_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MAWJIVO_REPLAY_RUN: ${{ inputs.replay_run }}
        run: |
          if ($env:MAWJIVO_REPLAY_RUN -notmatch '^\d+$') { throw 'Invalid diagnostic run id.' }
          $taskSource = gh run view $env:MAWJIVO_REPLAY_RUN --json workflowName,headSha,status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $taskSource.workflowName -ne 'Windows signed update acceptance' -or $taskSource.status -ne 'completed') { throw 'Only a completed acceptance run in this repository can be replayed.' }
          $taskVerifiedSource = gh run list --workflow ci.yml --commit $taskSource.headSha --limit 1 --json conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $taskVerifiedSource.Count -ne 1 -or $taskVerifiedSource[0].conclusion -ne 'success') { throw 'Original signed installer source must have passed full verification.' }
          gh run download $env:MAWJIVO_REPLAY_RUN --name windows-signed-acceptance --dir .tools/replay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath .tools/replay/.tools/acceptance-base -Destination .tools/acceptance-base -Recurse
          Copy-Item -LiteralPath .tools/replay/.tools/acceptance-next -Destination .tools/acceptance-next -Recurse
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/target/release | Out-Null
          Copy-Item .tools/replay/apps/desktop/src-tauri/target/release/*.exe apps/desktop/src-tauri/target/release/ -Force
          $taskReplayProduction = '${{ inputs.production_candidate_replay }}' -eq 'true'
          foreach ($taskPackage in @('.tools/acceptance-base','.tools/acceptance-next')) {
            $taskInfo = Get-Content -LiteralPath "$taskPackage/package-info.json" -Raw | ConvertFrom-Json
            if ($taskInfo.sourceCommit -ne $taskSource.headSha) { throw 'Artifact source commit mismatch.' }
            $taskSignatureChannel = if ($taskReplayProduction -and $taskPackage -eq '.tools/acceptance-next') { 'production' } else { 'test' }
            node scripts/verify-release.mjs $taskPackage $taskSignatureChannel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path .tools/tauri-driver/bin/tauri-driver.exe)) {
            cargo install tauri-driver --version 2.1.0 --locked --root .tools/tauri-driver
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $taskReference = Join-Path $env:RUNNER_TEMP 'mawjivo-signed-next-reference'
          $taskNext = Get-Content -LiteralPath .tools/acceptance-next/package-info.json -Raw | ConvertFrom-Json
          $taskProcess = Start-Process -FilePath (Resolve-Path -LiteralPath ".tools/acceptance-next/$($taskNext.name)").Path -ArgumentList @('/S',"/D=$taskReference") -Wait -PassThru -WindowStyle Hidden
          if ($taskProcess.ExitCode -ne 0) { throw 'Signed reference install failed.' }
          "MAWJIVO_ACCEPTANCE_REFERENCE_BINARY=$taskReference/mawjivo.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output 'Diagnostic replay only: evidence remains bound to the original installer source commit.'
      - name: Install current stable Microsoft WebView2 Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile .tools/webview2-bootstrapper.exe
          $taskSignature = Get-AuthenticodeSignature -LiteralPath .tools/webview2-bootstrapper.exe
          if ($taskSignature.Status -ne 'Valid' -or $taskSignature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation(?:,|$)') { throw 'Microsoft runtime installer signature invalid.' }
          $taskInstall = Start-Process -FilePath (Resolve-Path -LiteralPath .tools/webview2-bootstrapper.exe).Path -ArgumentList @('/silent','/install') -Wait -PassThru -WindowStyle Hidden
          if ($taskInstall.ExitCode -ne 0) { throw "WebView2 runtime installation failed: $($taskInstall.ExitCode)" }
      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          $taskRuntimeRoots = @((Join-Path ${env:ProgramFiles(x86)} 'Microsoft/EdgeWebView/Application'),(Join-Path $env:LOCALAPPDATA 'Microsoft/EdgeWebView/Application')) | Where-Object { Test-Path -LiteralPath $_ }
          $taskRuntime = $taskRuntimeRoots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Directory } | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'msedgewebview2.exe')) } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$taskRuntime) { throw 'WebView2 runtime unavailable.' }
          $taskVersion = (Get-Item -LiteralPath (Join-Path $taskRuntime.FullName 'msedgewebview2.exe')).VersionInfo.ProductVersion
          if ($taskVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Edge version unavailable.' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$($taskRuntime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Verified runtime and matching driver version: $taskVersion"
          New-Item -ItemType Directory -Force .tools/edge-driver | Out-Null
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$taskVersion/edgedriver_win64.zip" -OutFile .tools/edge-driver.zip
          Expand-Archive -LiteralPath .tools/edge-driver.zip -DestinationPath .tools/edge-driver -Force
          $taskDriverVersion = & .tools/edge-driver/msedgedriver.exe --version
          if ($taskDriverVersion -notmatch [regex]::Escape($taskVersion)) { throw 'Edge driver mismatch.' }
      # Runtime 150+ ignores WEBVIEW2_* overrides in elevated hosts. Test with
      # the runner user's medium token, as the actual current-user app runs.
      # No registry/security policy changes or app debugging code are needed.
      - name: Prepare pinned medium-integrity test launcher
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/gerardog/gsudo/releases/download/v2.6.1/gsudo.portable.zip' -OutFile .tools/gsudo.zip
          if ((Get-FileHash .tools/gsudo.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '21130bf178d7b9891207f00bff56f05b6b363ce9cec7b2d084e45fb12ee51f44') { throw 'gsudo digest mismatch.' }
          Expand-Archive -LiteralPath .tools/gsudo.zip -DestinationPath .tools/gsudo -Force
          $taskLauncher = (Get-ChildItem .tools/gsudo -Filter gsudo.exe -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1).FullName
          if (!$taskLauncher -or (Get-AuthenticodeSignature -LiteralPath $taskLauncher).Status -ne 'Valid') { throw 'Signed test launcher missing.' }
          "MAWJIVO_TEST_LAUNCHER=$taskLauncher" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prove actual install and signed in-app update with Windows vault
        if: inputs.diagnostics_only != true
        shell: pwsh
        env:
          MAWJIVO_ACCEPTANCE_FIXTURE_URL: ${{ vars.MAWJIVO_ACCEPTANCE_FIXTURE_URL }}
          MAWJIVO_ACCEPTANCE_DIRECT_DRIVER: ${{ inputs.replay_run != '' }}
          MAWJIVO_ACCEPTANCE_ATTACH_DRIVER: 'true'
        run: |
          $taskFlags = @()
          if ('${{ inputs.replay_run }}' -eq '' -or '${{ inputs.production_candidate_replay }}' -eq 'true') { $taskFlags += '--production-candidate' }
          & $env:MAWJIVO_TEST_LAUNCHER --integrity Medium node scripts/accept-installed-update.mjs .tools/acceptance-base .tools/acceptance-next .tools/tauri-driver/bin/tauri-driver.exe .tools/edge-driver/msedgedriver.exe .tools/installed-acceptance @taskFlags
          exit $LASTEXITCODE
      - name: Diagnose the previous real WebView startup failure
        if: inputs.diagnostics_only == true && inputs.replay_run != ''
        shell: pwsh
        run: |
          & $env:MAWJIVO_TEST_LAUNCHER --integrity Medium node scripts/diagnose-windows-session.mjs .tools/acceptance-base .tools/session-diagnostics --expect-ready
          exit $LASTEXITCODE
      - name: Retain concrete acceptance evidence and installers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed-acceptance
          path: |
            .tools/session-diagnostics/
            .tools/acceptance-base/
            .tools/acceptance-next/
            .tools/installed-acceptance/acceptance-proof.json
            .tools/installed-acceptance/driver.log
            .tools/installed-acceptance/failure.*
            .tools/installed-acceptance/native-diagnostics.json
            .tools/installed-acceptance/edge.log
            .tools/installed-acceptance/standalone-startup.json
            .tools/installed-acceptance/managed-app.json
            .tools/installed-acceptance/session-failure.json
            apps/desktop/src-tauri/target/release/verify_update.exe
            apps/desktop/src-tauri/target/release/acceptance_data.exe
            apps/desktop/src-tauri/target/release/setup.exe
          retention-days: 7

  archive:
    needs: [resolve, acceptance]
    if: needs.resolve.outputs.mode == 'production' || needs.resolve.outputs.mode == 'acceptance'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAWJIVO_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      MAWJIVO_RELEASE_MODE: ${{ needs.resolve.outputs.mode }}
      MAWJIVO_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install locked publishing dependencies
        shell: pwsh
        run: |
          $taskPnpm = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm.cmd install --global $taskPnpm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Recover this run's proven bytes and original production signature
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID --name windows-signed-acceptance --dir .tools/accepted-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath .tools/accepted-run/.tools/acceptance-next -Destination .tools/acceptance-next -Recurse
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/target/release | Out-Null
          Copy-Item -LiteralPath .tools/accepted-run/apps/desktop/src-tauri/target/release/verify_update.exe -Destination apps/desktop/src-tauri/target/release/verify_update.exe
          $taskInfo = Get-Content -LiteralPath .tools/acceptance-next/package-info.json -Raw | ConvertFrom-Json
          if ($taskInfo.sourceCommit -ne $env:GITHUB_SHA -or $taskInfo.version -ne $env:MAWJIVO_RELEASE_VERSION) { throw 'Accepted package source/version mismatch.' }
          Set-Content -LiteralPath .tools/release-notes.txt -Value $taskInfo.notesAr -Encoding utf8NoBOM
          node scripts/package-windows-release.mjs .tools/acceptance-next .tools/production-package $env:MAWJIVO_RELEASE_VERSION $env:GITHUB_SHA production .tools/release-notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-release.mjs .tools/production-package production
          exit $LASTEXITCODE
      - name: Archive the proven signed package
        shell: pwsh
        run: node scripts/github-release.mjs $env:MAWJIVO_RELEASE_TAG .tools/production-package .tools/accepted-run/.tools/installed-acceptance/acceptance-proof.json $env:GITHUB_SHA $env:MAWJIVO_RELEASE_MODE
      - name: Activate the proven production update, verify the public manifest, then clean older app packages
        if: needs.resolve.outputs.mode == 'production'
        shell: pwsh
        env:
          MAWJIVO_RELEASE_ACCOUNT_ID: ${{ vars.MAWJIVO_RELEASE_ACCOUNT_ID }}
          MAWJIVO_RELEASE_ACCESS_KEY_ID: ${{ secrets.MAWJIVO_RELEASE_ACCESS_KEY_ID }}
          MAWJIVO_RELEASE_SECRET_KEY: ${{ secrets.MAWJIVO_RELEASE_SECRET_KEY }}
        run: node scripts/publish-release.mjs .tools/production-package production .tools/accepted-run/.tools/installed-acceptance/acceptance-proof.json
  cleanup:
    needs: resolve
    if: needs.resolve.outputs.mode == 'cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install locked cleanup dependencies
        run: |
          task_pnpm=$(node -p 'require("./package.json").packageManager')
          npm install --global "$task_pnpm"
          pnpm install --frozen-lockfile
      - name: Remove only proven expired app packages
        env:
          MAWJIVO_RELEASE_ACCOUNT_ID: ${{ vars.MAWJIVO_RELEASE_ACCOUNT_ID }}
          MAWJIVO_RELEASE_ACCESS_KEY_ID: ${{ secrets.MAWJIVO_RELEASE_ACCESS_KEY_ID }}
          MAWJIVO_RELEASE_SECRET_KEY: ${{ secrets.MAWJIVO_RELEASE_SECRET_KEY }}
        run: node scripts/publish-release.mjs --cleanup
