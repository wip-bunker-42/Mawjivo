name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Prepare pinned release inputs
        shell: pwsh
        run: |
          $taskPnpm = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm.cmd install --global $taskPnpm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd media:tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd notices
          exit $LASTEXITCODE
      - name: Build installer
        shell: pwsh
        run: |
          pnpm.cmd tauri:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-secrets.mjs .tools/legal apps/desktop/src-tauri/service-artifact apps/desktop/dist
      - name: Retain installer for verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*
            .tools/legal/*
          retention-days: 7
