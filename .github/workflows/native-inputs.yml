name: Resolve native inputs
on:
  workflow_dispatch:
  push:
    paths: ['apps/desktop/src-tauri/Cargo.toml', '.github/workflows/native-inputs.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Resolve pinned native dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace
          exit $LASTEXITCODE
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/src-tauri/target
          key: mawjivo-windows-rust-1.99-inputs-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: mawjivo-windows-rust-1.99-
      - name: Prepare acceptance inputs
        shell: pwsh
        run: |
          $taskPnpm = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm.cmd install --global $taskPnpm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd service:artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd media:tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd --filter @mawjivo/desktop build
          exit $LASTEXITCODE
      - name: Native update regressions
        shell: pwsh
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --test updates
      - name: Format native sources
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --output=rust-inputs.patch -- apps/desktop/src-tauri
      - name: Retain resolved lock and formatting for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-inputs
          path: |
            apps/desktop/src-tauri/Cargo.lock
            rust-inputs.patch
          retention-days: 7
