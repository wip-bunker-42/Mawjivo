name: Windows upload verification
on:
  push:
    branches: [abdo/mawjivo-app]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-upload-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upload:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Install pinned tools
        shell: pwsh
        run: |
          npm.cmd install --global pnpm@12.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualVersion = & pnpm.cmd --version
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne '12.10.1') { throw 'Pinned pnpm installation failed.' }
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99.0
      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/src-tauri/target
          key: mawjivo-windows-rust-1.99-full-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: mawjivo-windows-rust-1.99-
      - name: Install locked dependencies and service artifact
        id: artifact-setup
        shell: pwsh
        run: |
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd service:artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd media:tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd --filter @mawjivo/desktop build
          exit $LASTEXITCODE
      - name: Format native sources
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --output=rustfmt.patch
      - name: Upload regressions
        shell: pwsh
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --test upload -- --nocapture
      - name: Native file binding regressions
        if: always() && steps.artifact-setup.outcome == 'success'
        shell: pwsh
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --test upload_binding -- --nocapture
      - name: Full native suite
        shell: pwsh
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-fail-fast
      - name: Native lint
        id: native-lint
        shell: pwsh
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Native checkout formatting
        if: always() && steps.artifact-setup.outcome == 'success'
        shell: pwsh
        run: git diff --exit-code -- apps/desktop/src-tauri/src apps/desktop/src-tauri/tests
      - name: Save native dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && steps.native-lint.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/src-tauri/target
          key: mawjivo-windows-rust-1.99-full-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Return formatting changes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-formatting
          path: rustfmt.patch
          retention-days: 2
