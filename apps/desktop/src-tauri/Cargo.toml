[package]
name = "mawjivo"
default-run = "mawjivo"
version = "0.1.2"
description = "Accessible personal social publishing"
edition = "2024"
rust-version = "1.99"

[features]
operator-tools = []

[[bin]]
name = "setup"
path = "src/bin/setup.rs"
required-features = ["operator-tools"]

[[bin]]
name = "acceptance_data"
path = "src/bin/acceptance_data.rs"
required-features = ["operator-tools"]

[[bin]]
name = "verify_update"
path = "src/bin/verify_update.rs"
required-features = ["operator-tools"]

[lib]
name = "mawjivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
keyring = "=4.2.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
uuid = { version = "=1.27.0", features = ["v4"] }
sha2 = "=0.11.0"
base64 = "=0.23.1"
getrandom = "=0.4.3"
zeroize = "=1.9.1"
tokio = { version = "=1.53.2", features = ["sync", "fs", "io-util", "time", "macros"] }
bytes = "=1.12.1"
futures-util = "=0.3.34"
async-trait = "=0.1.92"
aes-gcm = "=0.11.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif", "pnm"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-updater = "=2.13.3"
minisign-verify = "=0.3.0"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
