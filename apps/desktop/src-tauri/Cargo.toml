[package]
name = "mawjivo"
version = "0.1.0"
description = "Accessible personal social publishing"
edition = "2024"
rust-version = "1.99"

[lib]
name = "mawjivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
